services:
  meshpulse:
    image: ghcr.io/jumpingmushroom/meshpulse:latest
    # build: .   # uncomment (and comment out image) to build from source
    restart: unless-stopped
    env_file: .env
    volumes:
      - meshpulse-data:/data
    ports:
      - '3000:3000'

volumes:
  meshpulse-data: {}
